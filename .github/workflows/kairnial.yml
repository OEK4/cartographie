name: Kairnial → kairnial.json

on:
  schedule:
    - cron: '17 */3 * * *'      # filet de sécurité GitHub (toutes les 3 h) ; le vrai rythme 15 min vient du déclencheur Apps Script
  workflow_dispatch:         # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: kairnial
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40          # au-delà, le robot est coupé : un résultat partiel n'écrase jamais kairnial.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer le navigateur
        run: |
          npm init -y >/dev/null
          npm install playwright@1.47.2 xlsx@0.18.5 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Exporter depuis Kairnial
        env:
          KAIRNIAL_URL: ${{ secrets.KAIRNIAL_URL }}
          KAIRNIAL_LOGIN: ${{ secrets.KAIRNIAL_LOGIN }}
          KAIRNIAL_PASSWORD: ${{ secrets.KAIRNIAL_PASSWORD }}
          KAIRNIAL_PROJET: ${{ secrets.KAIRNIAL_PROJET }}
          KAIRNIAL_PJ_URL: ${{ secrets.KAIRNIAL_PJ_URL }}
          KAIRNIAL_PJ_KEY: ${{ secrets.KAIRNIAL_PJ_KEY }}
        run: node robot-kairnial/export.js

      - name: Publier kairnial.json
        if: always()
        run: |
          git config user.name "robot-kairnial"
          git config user.email "robot@users.noreply.github.com"
          git add kairnial.json robot-journal.txt; git add pj-index.json pj-decouverte.json 2>/dev/null || true
          git diff --cached --quiet && echo "Aucun changement" && exit 0
          git commit -m "Kairnial : états des documents $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Garder les captures et le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: robot-kairnial/captures/
          retention-days: 3
