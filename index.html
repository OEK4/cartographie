  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo Narrow';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ead72787-6fc7-4905-b57e-4ca16436b0db\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo Narrow';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6a3f8019-7e90-4d3b-9205-f8d29de66691\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"3bf9c1eb-ca2e-4a58-8e20-48823ba35ebb\"><\u002Fscript>\n<script src=\"85ee20d7-6d38-4b6c-9b01-43740603611b\"><\u002Fscript>\n<script src=\"3fe75fe3-0a31-4464-89ea-ffb3c140789c\"><\u002Fscript>\n<script src=\"2cc798db-2c24-4077-abc5-6d9f45d54ee9\"><\u002Fscript>\n<script src=\"ff80452f-9367-4f85-8824-b5a7fcc83c3d\"><\u002Fscript>\n<style>\nhtml,body{margin:0;padding:0;background:#F2F1ED;}\na{color:#4A7DBA;} a:hover{color:#2C5A94;}\ninput:focus{outline:2px solid #2C3A33;outline-offset:-2px;background:#FFFFFF !important;z-index:3;}\n<\u002Fstyle>\n<\u002Fhelmet>\n<sc-if value=\"{{ lockOn }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:9999;background:#2C3A33;display:flex;align-items:center;justify-content:center;font-family:'Archivo Narrow',Arial,sans-serif;\">\n    <div style=\"width:340px;background:#FFFFFF;border-radius:14px;padding:26px;box-shadow:0 12px 40px rgba(0,0,0,0.35);display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-size:19px;font-weight:700;color:#1F2620;\">CARTOGRAPHIE LOCAUX<\u002Fdiv>\n      <div style=\"font-size:13px;color:#6B675F;margin-top:-6px;\">{{ stepMsg }}<\u002Fdiv>\n      <sc-if value=\"{{ stepMail }}\" hint-placeholder-val=\"{{ true }}\">\n        <input type=\"email\" value=\"{{ mailTry }}\" sc-camel-on-change=\"{{ onMailTry }}\" sc-camel-on-key-down=\"{{ onMailKey }}\" placeholder=\"prenom.nom@domaine.ma\" style=\"padding:11px 12px;border:1.5px solid {{ mailBd }};border-radius:9px;font-family:'Archivo Narrow',sans-serif;font-size:15px;font-weight:600;color:#1F2620;background:#FBFAF8;\">\n        <sc-if value=\"{{ mailErr }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12.5px;font-weight:600;color:#D9534F;\">{{ mailErrMsg }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ inviteOn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12.5px;font-weight:600;color:#2C7A4B;background:#EAF6EC;border:1px solid #BEE0C6;border-radius:8px;padding:7px 10px;\">{{ inviteMsg }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ doCheckMail }}\" style=\"background:#2C3A33;color:#FFFFFF;border:none;border-radius:9px;padding:11px 18px;font-family:'Archivo Narrow',sans-serif;font-size:15px;font-weight:600;cursor:pointer;\" style-hover=\"background:#1F2A24;\">{{ checkLabel }}<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ stepCode }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:8px;background:#EEF2EC;border:1px solid #C9D6C4;border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:600;color:#2C3A33;\">\n          <span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ mailOk }}<\u002Fspan>\n          <span sc-camel-on-click=\"{{ doBackMail }}\" style=\"cursor:pointer;color:#6B675F;font-weight:600;text-decoration:underline;\">changer<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"password\" value=\"{{ pwTry }}\" sc-camel-on-change=\"{{ onPwTry }}\" sc-camel-on-key-down=\"{{ onPwKey }}\" placeholder=\"Code d’accès\" style=\"padding:11px 12px;border:1.5px solid {{ pwBd }};border-radius:9px;font-family:'Archivo Narrow',sans-serif;font-size:15px;font-weight:600;color:#1F2620;background:#FBFAF8;\">\n        <sc-if value=\"{{ pwErr }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12.5px;font-weight:600;color:#D9534F;\">Code incorrect.<\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ doUnlock }}\" style=\"background:#2C3A33;color:#FFFFFF;border:none;border-radius:9px;padding:11px 18px;font-family:'Archivo Narrow',sans-serif;font-size:15px;font-weight:600;cursor:pointer;\" style-hover=\"background:#1F2A24;\">Déverrouiller<\u002Fbutton>\n      <\u002Fsc-if>\n      <div style=\"font-size:11px;font-style:italic;color:#8C8880;\">La session reste ouverte dans cet onglet ; le verrou revient à la fermeture ou via le bouton Verrouiller.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ adminPanelDisabled }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeAdmin }}\" style=\"position:fixed;inset:0;z-index:9998;background:rgba(31,38,32,0.45);display:flex;align-items:center;justify-content:center;font-family:'Archivo Narrow',Arial,sans-serif;\">\n    <div sc-camel-on-click=\"{{ stopProp }}\" style=\"width:430px;max-height:80vh;overflow-y:auto;background:#FFFFFF;border-radius:14px;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,0.3);display:flex;flex-direction:column;gap:10px;\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n        <span style=\"font-family:'Archivo',sans-serif;font-size:17px;font-weight:700;\">Gestion des accès<\u002Fspan>\n        <span sc-camel-on-click=\"{{ closeAdmin }}\" style=\"cursor:pointer;font-size:18px;color:#8C8880;font-weight:700;\">×<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:12.5px;color:#6B675F;\">Adresses autorisées à ouvrir le fichier. Vous seul (administrateur) voyez ce panneau.<\u002Fdiv>\n      <div style=\"display:flex;gap:6px;\">\n        <input value=\"{{ newMail }}\" sc-camel-on-change=\"{{ onNewMail }}\" sc-camel-on-key-down=\"{{ onNewMailKey }}\" placeholder=\"ajouter une adresse…\" style=\"flex:1;padding:8px 10px;border:1.5px solid #C9C5BD;border-radius:8px;font-family:'Archivo Narrow',sans-serif;font-size:13.5px;font-weight:600;background:#FBFAF8;\">\n        <button sc-camel-on-click=\"{{ addMail }}\" style=\"background:#2C3A33;color:#FFFFFF;border:none;border-radius:8px;padding:8px 14px;font-family:'Archivo Narrow',sans-serif;font-size:13.5px;font-weight:600;cursor:pointer;\">Ajouter<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px;border:1px solid #E9E6E0;border-radius:8px;padding:8px;background:#FBFAF8;\">\n        <sc-for list=\"{{ userRows }}\" as=\"u\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#1F2620;padding:3px 4px;border-bottom:1px solid #F0EDE8;\">\n            <span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ u.mail }}<\u002Fspan>\n            <span style=\"font-size:11px;color:#8C8880;font-weight:600;\">{{ u.role }}<\u002Fspan>\n            <span sc-camel-on-click=\"{{ u.invite }}\" title=\"Envoyer l’invitation par e-mail\" style=\"cursor:pointer;color:#2C3A33;font-size:11px;font-weight:700;border:1px solid #C9C5BD;border-radius:5px;padding:1px 6px;\">Inviter<\u002Fspan>\n            <span sc-camel-on-click=\"{{ u.copy }}\" title=\"Copier le texte de l’invitation\" style=\"cursor:pointer;color:#6B675F;font-size:11px;font-weight:700;border:1px solid #DDD9D2;border-radius:5px;padding:1px 6px;\">Copier<\u002Fspan>\n            <span sc-camel-on-click=\"{{ u.del }}\" title=\"Retirer\" style=\"cursor:pointer;color:#D9534F;font-weight:700;font-size:15px;\">×<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ inviteOn }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;font-weight:600;color:#2C7A4B;background:#EAF6EC;border:1px solid #BEE0C6;border-radius:8px;padding:6px 9px;\">{{ inviteMsg }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;\">\n        <span style=\"flex:none;\">Code d’accès :<\u002Fspan>\n        <input value=\"{{ codeVal }}\" sc-camel-on-change=\"{{ onCodeVal }}\" style=\"flex:1;padding:8px 10px;border:1.5px solid #C9C5BD;border-radius:8px;font-family:'Archivo Narrow',sans-serif;font-size:13.5px;font-weight:700;background:#FBFAF8;\">\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #E9E6E0;padding-top:10px;display:flex;flex-direction:column;gap:7px;\">\n        <span style=\"font-size:13.5px;font-weight:700;\">Gestion à distance<\u002Fspan>\n        <div style=\"font-size:12px;color:#6B675F;\">URL d’une liste que vous hébergez. Formats acceptés : <b>acces.json<\u002Fb>, fichier texte, ou <b>Google Sheets publié<\u002Fb> (colonnes : e-mail, statut « admin » / « révoqué », ligne <i>code;VOTRECODE<\u002Fi>). Hébergeurs reconnus automatiquement (collez le lien normal) : <b>GitHub Gist secret<\u002Fb>, fichier GitHub, <b>npoint.io<\u002Fb>, Pastebin, Google Sheets publié sur le web, votre intranet. Google&nbsp;Drive est bloqué par Google pour ce type de lecture : utilisez plutôt un Gist secret ou npoint.io.<\u002Fdiv>\n        <input value=\"{{ remoteUrlVal }}\" sc-camel-on-change=\"{{ onRemoteUrl }}\" placeholder=\"https://…/acces.json\" style=\"padding:8px 10px;border:1.5px solid #C9C5BD;border-radius:8px;font-family:'Archivo Narrow',sans-serif;font-size:12.5px;font-weight:600;background:#FBFAF8;\">\n        <div style=\"font-size:12px;font-weight:600;color:#4A463F;background:{{ remoteBg }};border-radius:7px;padding:6px 9px;\">{{ remoteInfo }}<\u002Fdiv>\n        <div style=\"display:flex;gap:6px;\">\n          <button sc-camel-on-click=\"{{ doRefreshRemote }}\" style=\"flex:1;background:#2C3A33;color:#FFFFFF;border:none;border-radius:8px;padding:8px 10px;font-family:'Archivo Narrow',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;\">Actualiser maintenant<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ dlRemoteModel }}\" style=\"flex:1;background:#FFFFFF;color:#2C3A33;border:1.5px solid #2C3A33;border-radius:8px;padding:8px 10px;font-family:'Archivo Narrow',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;\" style-hover=\"background:#EEF2EC;\">Modèle acces.json<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;font-style:italic;color:#8C8880;\">Révocation : ajoutez l’adresse dans « revoques ». Les sessions ouvertes sont contrôlées toutes les 5 minutes et verrouillées aussitôt.<\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ dlUsers }}\" style=\"background:#FFFFFF;color:#2C3A33;border:1.5px solid #2C3A33;border-radius:8px;padding:9px 14px;font-family:'Archivo Narrow',sans-serif;font-size:13.5px;font-weight:600;cursor:pointer;\" style-hover=\"background:#EEF2EC;\">Télécharger utilisateurs.txt<\u002Fbutton>\n      <div style=\"font-size:11px;font-style:italic;color:#8C8880;\">Vos modifications s’appliquent sur ce poste. Pour diffuser la liste : téléchargez utilisateurs.txt et placez-le à côté du fichier partagé (il est prioritaire sur la liste intégrée).<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"height:100vh;overflow:hidden;display:flex;flex-direction:column;font-family:'Archivo Narrow',Arial,sans-serif;color:#1F2620;\">\n  <div style=\"background:#FFFFFF;border-bottom:1px solid #DDD9D2;padding:8px 28px;display:flex;flex:none;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;\">\n    <div style=\"display:flex;align-items:center;gap:12px;min-width:0;\">\n      <img src=\"https://drive.google.com/thumbnail?id=1p4Xu-kw1YRoCoIV ence ; si elle dépasse la fenêtre, trains parallèles = arr.sup(durée ÷ fenêtre) et la colonne Jours ouvrés affiche occupation / fenêtre). Mode « Lissé » : équipes = rythme requis (quantité ÷ jours ouvrés) × équipes par unité/jour, arrondi au supérieur. Effectif = pers/équipe locaux × éq. locaux + pers/équipe circul. × éq. circul. Le planning est respecté ; ajustez les valeurs pour le compromis. Quantités reprises en direct des onglets Nombre des locaux et Circulations (filtres RbR appliqués). * niveau sans activité dans Planification.xlsx : quantités comptées, équipes non calculées.<\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ planDiagOn }}\">\n          <div style=\"flex:1;min-height:0;overflow:auto;padding:10px 18px 16px 18px;\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;\"><span style=\"font-size:13.5px;font-weight:700;\">Effectif par jour ouvré ({{ diagUnitLbl }})<\u002Fspan><button sc-camel-on-click=\"{{ dlEff }}\" style=\"padding:3px 12px;border:1.5px solid #2C3A33;border-radius:7px;cursor:pointer;font-family:'Archivo Narrow',sans-serif;font-size:12px;font-weight:600;background:#FFFFFF;color:#2C3A33;\" style-hover=\"background:#EEF2EC;\">Télécharger PNG<\u002Fbutton><\u002Fdiv>\n            <div style=\"position:relative;height:235px;border:1px solid #DDD9D2;border-radius:8px;background:#FBFAF8;overflow:hidden;\">\n              <svg sc-camel-view-box=\"0 0 1000 235\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;inset:0;width:100%;height:100%;\">\n                <path d=\"{{ effArea }}\" style=\"fill:rgba(127,176,232,0.35);stroke:none;\"><\u002Fpath>\n                <path d=\"{{ effLine }}\" style=\"fill:none;stroke:#4A7DBA;stroke-width:2;vector-effect:non-scaling-stroke;\"><\u002Fpath>\n              <\u002Fsvg>\n              <sc-if value=\"{{ diagTodayOn }}\"><div style=\"position:absolute;top:0;bottom:0;left:{{ diagTodayLeft }};width:2px;background:#D9534F;\"><\u002Fdiv><\u002Fsc-if>\n              <div style=\"position:absolute;top:4px;left:8px;font-size:11px;font-weight:700;color:#4A7DBA;\">max {{ effMaxLbl }} {{ diagUnitLbl }}<\u002Fdiv>\n              <div style=\"position:absolute;bottom:2px;left:8px;font-size:10.5px;color:#8C8880;\">{{ diagStart }}<\u002Fdiv>\n              <div style=\"position:absolute;bottom:2px;right:8px;font-size:10.5px;color:#8C8880;\">{{ diagEnd }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin:14px 0 5px 0;\"><span style=\"font-size:13.5px;font-weight:700;\">Courbe en S : avancement cumulé planifié (locaux + circulations)<\u002Fspan><button sc-camel-on-click=\"{{ dlS }}\" style=\"padding:3px 12px;border:1.5px solid #2C3A33;border-radius:7px;cursor:pointer;font-family:'Archivo Narrow',sans-serif;font-size:12px;font-weight:600;background:#FFFFFF;color:#2C3A33;\" style-hover=\"background:#EEF2EC;\">Télécharger PNG<\u002Fbutton><\u002Fdiv>\n            <div style=\"position:relative;height:235px;border:1px solid #DDD9D2;border-radius:8px;background:#FBFAF8;overflow:hidden;\">\n              <svg sc-camel-view-box=\"0 0 1000 235\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;inset:0;width:100%;height:100%;\">\n                <path d=\"{{ sArea }}\" style=\"fill:rgba(154,225,131,0.30);stroke:none;\"><\u002Fpath>\n                <path d=\"{{ sLine }}\" style=\"fill:none;stroke:#4E9153;stroke-width:2.5;vector-effect:non-scaling-stroke;\"><\u002Fpath>\n              <\u002Fsvg>\n              <sc-if value=\"{{ diagTodayOn }}\"><div style=\"position:absolute;top:0;bottom:0;left:{{ diagTodayLeft }};width:2px;background:#D9534F;\"><\u002Fdiv><\u002Fsc-if>\n              <div style=\"position:absolute;top:4px;left:8px;font-size:11px;font-weight:700;color:#4E9153;\">100 % = {{ sTotal }} unités<\u002Fdiv>\n              <div style=\"position:absolute;top:4px;right:8px;font-size:11px;font-weight:700;color:#D9534F;\">{{ sTodayLbl }}<\u002Fdiv>\n              <div style=\"position:absolute;bottom:2px;left:8px;font-size:10.5px;color:#8C8880;\">{{ diagStart }}<\u002Fdiv>\n              <div style=\"position:absolute;bottom:2px;right:8px;font-size:10.5px;color:#8C8880;\">{{ diagEnd }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin:14px 0 5px 0;\"><span style=\"font-size:13.5px;font-weight:700;\">Effectif par période (maximum par mois, {{ diagUnitLbl }})<\u002Fspan><button sc-camel-on-click=\"{{ dlMois }}\" style=\"padding:3px 12px;border:1.5px solid #2C3A33;border-radius:7px;cursor:pointer;font-family:'Archivo Narrow',sans-serif;font-size:12px;font-weight:600;background:#FFFFFF;color:#2C3A33;\" style-hover=\"background:#EEF2EC;\">Télécharger PNG<\u002Fbutton><\u002Fdiv>\n            <div style=\"position:relative;height:250px;border:1px solid #DDD9D2;border-radius:8px;background:#FBFAF8;overflow:hidden;display:flex;align-items:flex-end;gap:3px;padding:26px 12px 24px 12px;box-sizing:border-box;\">\n              <sc-for list=\"{{ effMonths }}\" as=\"b\" hint-placeholder-count=\"12\">\n                <div title=\"{{ b.tip }}\" style=\"flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;\">\n                  <div style=\"font-size:9.5px;font-weight:700;color:#2C5A94;\">{{ b.val }}<\u002Fdiv>\n                  <div style=\"width:100%;height:{{ b.h }};background:#7FB0E8;border:1px solid #4A7DBA;border-radius:3px 3px 0 0;box-sizing:border-box;\"><\u002Fdiv>\n                  <div style=\"position:absolute;bottom:-19px;font-size:8.5px;color:#8C8880;white-space:nowrap;\">{{ b.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ trainOn }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin:14px 0 5px 0;\"><span style=\"font-size:13.5px;font-weight:700;\">Schéma du chemin de fer : où se trouve chaque équipe au fil du temps<\u002Fspan><button sc-camel-on-click=\"{{ dlTrain }}\" style=\"padding:3px 12px;border:1.5px solid #2C3A33;border-radius:7px;cursor:pointer;font-family:'Archivo Narrow',sans-serif;font-size:12px;font-weight:600;background:#FFFFFF;color:#2C3A33;\" style-hover=\"background:#EEF2EC;\">Télécharger PNG<\u002Fbutton><\u002Fdiv>\n              <div style=\"border:1px solid #DDD9D2;border-radius:8px;background:#FBFAF8;padding:8px 12px 6px 12px;\">\n                <sc-for list=\"{{ trainRows }}\" as=\"tr\" hint-placeholder-count=\"8\">\n                  <div style=\"display:flex;align-items:center;height:22px;\">\n                    <div style=\"width:160px;flex:none;font-size:11px;font-weight:600;color:#4A463F;white-space:nowrap;overflow:hidden;\">{{ tr.label }}<\u002Fdiv>\n                    <div style=\"flex:1;position:relative;height:14px;background:#F1EFEA;border-radius:3px;\">\n                      <sc-for list=\"{{ tr.segs }}\" as=\"s2\" hint-placeholder-count=\"6\">\n                        <div title=\"{{ s2.tip }}\" style=\"position:absolute;left:{{ s2.left }};width:{{ s2.width }};top:0;height:14px;background:{{ s2.color }};border:1px solid #4A463F;border-radius:3px;box-sizing:border-box;box-shadow:{{ s2.bs }};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#1F2620;overflow:hidden;white-space:nowrap;\">{{ s2.lab }}<\u002Fdiv>\n                      <\u002Fsc-for>\n                      <sc-for list=\"{{ tr.arrows }}\" as=\"a2\" hint-placeholder-count=\"4\">\n                        <div title=\"{{ a2.tip }}\" style=\"position:absolute;left:{{ a2.left }};top:-4px;z-index:3;color:#D9534F;font-size:13px;font-weight:900;line-height:14px;text-shadow:0 0 2px #FFFFFF, 0 0 2px #FFFFFF;cursor:default;\">{{ a2.glyph }}<\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"font-size:10.5px;font-style:italic;color:#8C8880;margin-top:4px;\">Chaque ligne = un étage ; chaque bloc = l’équipe présente (Éq.N ; suffixe C et liseré foncé = circulations). La <span style=\"color:#D9534F;font-weight:700;\">flèche rouge<\u002Fspan> (↗ monte, ↘ descend) marque le moment où l’équipe part vers un autre étage — survolez pour la destination et la date.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"margin-top:8px;font-size:11.5px;font-style:italic;color:#6B675F;\">Calculé sur les délais ajustés et les jours comptés : toute modification (quantités, équipes, pers/équipe, jours, calendrier) met les courbes à jour instantanément.<\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <sc-if value=\"{{ avOn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:none;display:flex;gap:16px;align-items:center;margin-top:6px;font-size:11.5px;color:#4A463F;flex-wrap:wrap;\">\n        <span style=\"display:inline-flex;align-items:center;gap:5px;\"><span style=\"width:26px;height:12px;border:1px solid #55524B;background:linear-gradient(90deg,#7FB0E8 50%,#EAF1FB 50%);display:inline-block;\"><\u002Fspan>En cours : remplissage = % réalisé<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:5px;\"><span style=\"width:26px;height:12px;border:1px solid #55524B;background:#7FB0E8;box-shadow:inset 0 0 0 2px rgba(0,0,0,0.28);display:inline-block;\"><\u002Fspan>Terminé (100 %)<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:5px;\"><span style=\"width:26px;height:12px;border:1px solid #55524B;background:linear-gradient(90deg,#7FB0E8 25%,#EAF1FB 25%);box-shadow:inset 0 0 0 2px #D9534F;display:inline-block;\"><\u002Fspan>En retard sur le délai<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"flex:none;margin-top:6px;font-size:11.5px;color:#6B675F;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;\">\n      <div>Sauvegarde automatique dans ce navigateur. « Exporter » télécharge Excel ou HTML avec vos valeurs.<\u002Fdiv>\n      <div>Même géométrie que la coupe, une case par niveau et par bâtiment.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ calOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(31,38,32,0.45);z-index:110;display:flex;align-items:center;justify-content:center;padding:20px;\">\n      <div style=\"background:#FFFFFF;border-radius:12px;max-width:1150px;width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,0.3);\">\n        <div style=\"flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid #E0DCD4;\">\n          <div style=\"font-family:'Archivo',sans-serif;font-size:16px;font-weight:700;\">Calendrier des jours comptés<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;\">\n            <button sc-camel-on-click=\"{{ calReset }}\" style=\"padding:6px 14px;border:1.5px solid #C9C5BD;border-radius:7px;cursor:pointer;font-family:'Archivo Narrow',sans-serif;font-size:13px;font-weight:600;background:#FFFFFF;color:#4A463F;\" style-hover=\"background:#F1EFEA;\">Réinitialiser<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ toggleCal }}\" style=\"padding:6px 14px;border:none;border-radius:7px;cursor:pointer;font-family:'Archivo Narrow',sans-serif;font-size:13px;font-weight:600;background:#2C3A33;color:#FFFFFF;\" style-hover=\"background:#1F2A24;\">Fermer<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 18px;font-size:12px;color:#4A463F;border-bottom:1px solid #EDEAE4;\">\n          <span style=\"display:inline-flex;align-items:center;gap:5px;\"><span style=\"width:16px;height:16px;border-radius:4px;background:#EEF2EC;border:1px solid #C9C5BD;display:inline-block;\"><\u002Fspan>Compté<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:5px;\"><span style=\"width:16px;height:16px;border-radius:4px;background:#EFEDE8;border:1px solid #E5E2DC;display:inline-block;\"><\u002Fspan>Non compté (jour de semaine décoché)<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:5px;\"><span style=\"width:16px;height:16px;border-radius:4px;background:#F9D9D6;border:1px solid #E5B3AE;display:inline-block;\"><\u002Fspan>Exclu manuellement (férié, arrêt…)<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:5px;\"><span style=\"width:16px;height:16px;border-radius:4px;background:#FFFFFF;border:2px solid #2C3A33;display:inline-block;box-sizing:border-box;\"><\u002Fspan>Modifié manuellement<\u002Fspan>\n          <span style=\"font-style:italic;color:#8C8880;\">Cliquer un jour pour basculer compté / non compté.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;overflow-y:auto;padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;\">\n          <sc-for list=\"{{ calMonths }}\" as=\"mo\" hint-placeholder-count=\"6\">\n            <div style=\"width:196px;border:1px solid #E5E2DC;border-radius:8px;padding:8px;\">\n              <div style=\"font-size:12.5px;font-weight:700;text-align:center;margin-bottom:5px;\">{{ mo.label }}<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:2px;\">\n                <sc-for list=\"{{ mo.cells }}\" as=\"c\" hint-placeholder-count=\"35\">\n                  <div sc-camel-on-click=\"{{ c.click }}\" title=\"{{ c.title }}\" style=\"height:21px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;border-
